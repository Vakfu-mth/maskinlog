<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maskin Log</title>

<style>
body {
    font-family: Arial;
    background: #f4f6f9;
    margin: 0;
}

.header {
    background: #003a8f;
    color: white;
    padding: 15px;
    text-align: center;
    font-size: 20px;
    font-weight: bold;
}

.container {
    max-width: 400px;
    margin: 20px auto;
    background: white;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}

label {
    font-weight: bold;
    margin-top: 15px;
    display: block;
}

input[type="text"],
select,
button {
    width: 100%;
    padding: 12px;
    margin-top: 8px;
    border-radius: 8px;
    border: 1px solid #ccc;
    font-size: 16px;
}

input[type="time"],
input[type="date"] {
    width: 100%;
    max-width: 180px;
    padding: 12px;
    margin-top: 8px;
    border-radius: 8px;
    border: 1px solid #ccc;
    font-size: 16px;
}

button {
    background: #003a8f;
    color: white;
    border: none;
    margin-top: 20px;
    font-weight: bold;
    cursor: pointer;
}

.checkbox-group {
    margin-top: 10px;
}

#andetInput {
    display: none;
}
</style>
</head>

<body>

<div class="header">Maskin Log</div>

<div class="container">
<form>

<label>Maskintype</label>
<select id="maskine" required>
    <option value="">Vælg maskine</option>
    <option>Gravemaskine</option>
    <option>Dozer</option>
    <option>Læssemaskine</option>
    <option>Kran</option>
    <option>Andet</option>
</select>

<input type="text" id="andetInput" placeholder="Skriv maskintype...">

<label>Start tid</label>
<input type="time" required>

<label>Slut tid</label>
<input type="time" required>

<label>Dato</label>
<input type="date" required>

<label>Workfront</label>
<div class="checkbox-group">
    <label><input type="checkbox"> WF1</label>
    <label><input type="checkbox"> WF2</label>
    <label><input type="checkbox"> WF3</label>
</div>

<button type="submit">Gem</button>

</form>
</div>

<script>
// Vis "andet" felt
document.getElementById("maskine").addEventListener("change", function() {
    const andetInput = document.getElementById("andetInput");

    if (this.value === "Andet") {
        andetInput.style.display = "block";
        andetInput.required = true;
    } else {
        andetInput.style.display = "none";
        andetInput.required = false;
    }
});

// Send data
document.querySelector("form").addEventListener("submit", function(e){
    e.preventDefault();

    let wf = [];
    document.querySelectorAll("input[type=checkbox]:checked")
        .forEach(el => wf.push(el.parentElement.innerText.trim()));

    let maskine = document.getElementById("maskine").value;
    let andet = document.getElementById("andetInput").value;

    if (maskine === "Andet") {
        maskine = andet;
    }

    const data = {
        maskintype: maskine,
        startTid: document.querySelectorAll('[type=time]')[0].value,
        slutTid: document.querySelectorAll('[type=time]')[1].value,
        dato: document.querySelector('[type=date]').value,
        workfront: wf.join(", ")
    };

    fetch("https://webhook.site/6b25793c-3475-4684-8af3-e1fa59f0700d", {
        method: "POST",
        mode: "no-cors",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify(data)
    })
    .then(() => {
        alert("Gemt!");
        document.querySelector("form").reset();
    });
});
</script>

</body>
</html>
