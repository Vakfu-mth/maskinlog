cform id=\\\"logForm\\\"\u003e\\n    \u003clabel\u003eMaskintype:\u003c/label\u003e\u003cbr\u003e\\n    \u003cinput type=\\\"text\\\" name=\\\"maskintype\\\" required\u003e\u003cbr\u003e\u003cbr\u003e\\n\\n    \u003clabel\u003eStart tid:\u003c/label\u003e\u003cbr\u003e\\n    \u003cinput type=\\\"time\\\" name=\\\"startTid\\\" required\u003e\u003cbr\u003e\u003cbr\u003e\\n\\n    \u003clabel\u003eSlut tid:\u003c/label\u003e\u003cbr\u003e\\n    \u003cinput type=\\\"time\\\" name=\\\"slutTid\\\" required\u003e\u003cbr\u003e\u003cbr\u003e\\n\\n    \u003clabel\u003eDato:\u003c/label\u003e\u003cbr\u003e\\n    \u003cinput type=\\\"date\\\" name=\\\"dato\\\" required\u003e\u003cbr\u003e\u003cbr\u003e\\n\\n    \u003clabel\u003eWorkfront:\u003c/label\u003e\u003cbr\u003e\\n    \u003cinput type=\\\"checkbox\\\" name=\\\"wf\\\" value=\\\"WF1\\\"\u003e WF1\\n    \u003cinput type=\\\"checkbox\\\" name=\\\"wf\\\" value=\\\"WF2\\\"\u003e WF2\\n    \u003cinput type=\\\"checkbox\\\" name=\\\"wf\\\" value=\\\"WF3\\\"\u003e WF3\\n    \u003cbr\u003e\u003cbr\u003e\\n\\n    \u003cbutton type=\\\"submit\\\"\u003eGem\u003c/button\u003e\\n\u003c/form\u003e\\n\\n\u003cp id=\\\"status\\\"\u003e\u003c/p\u003e\\n\\n\u003cscript\u003e\\ndocument.getElementById(\\\"logForm\\\").addEventListener(\\\"submit\\\", function(e) {\\n    e.preventDefault();\\n\\n    const formData = new FormData(this);\\n\\n    const wf = [];\\n    document.querySelectorAll('input[name=\\\"wf\\\"]:checked').forEach(el =\u003e wf.push(el.value));\\n\\n    const data = {\\n        maskintype: formData.get(\\\"maskintype\\\"),\\n        startTid: formData.get(\\\"startTid\\\"),\\n        slutTid: formData.get(\\\"slutTid\\\"),\\n        dato: formData.get(\\\"dato\\\"),\\n        workfront: wf.join(\\\", \\\")\\n    };\\n\\n    fetch(\\\"DIN_WEBAPP_URL\\\", {\\n        method: \\\"POST\\\",\\n        body: JSON.stringify(data)\\n    })\\n    .then(res =\u003e res.text())\\n    .then(() =\u003e {\\n        document.getElementByI
